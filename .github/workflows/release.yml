# v で始まるタグ（例: v0.1.0）を push すると、
# 自己完結型とランタイム必須の 2 種類の zip
# （exe とサンプル付箋 SampleNotes\ を同梱）を添付した下書きリリースを作成します。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build -c Release

      - name: Publish both variants
        shell: pwsh
        run: ./scripts/publish.ps1

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem artifacts -File | Format-Table Name, Length

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.zip
          draft: true
          generate_release_notes: true
